name: P3b gacha recovery foundations
on:
  pull_request:
    paths:
      - 'game-server/**'
      - 're_harness/**'
      - 'tests/test_functional_slices.py'
      - 'docs/production/FUNCTIONAL_SLICE_CONTRACT_V1.md'
      - 'scripts/blocked_rework.py'
      - 'tests/test_blocked_rework.py'
      - '.github/workflows/p3b-recovery.yml'
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline blocked rework tests
        run: python -m unittest discover -s tests -p 'test_blocked_rework.py' -v
      - name: Screenshot evidence gate tests
        run: python -m unittest discover -s tests -p 'test_evidence_review.py' -v
      - name: Functional slice scope and evidence gates
        run: python -m unittest discover -s tests -p 'test_functional_slices.py' -v
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: returnsaiyan
          POSTGRES_PASSWORD: returnsaiyan_pass
          POSTGRES_DB: returnsaiyan_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U returnsaiyan -d returnsaiyan_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: game-server/go.mod
      - name: Go server integration and offline tests
        working-directory: game-server
        run: go test -p 1 ./internal/domain/hero/... ./internal/repository/postgres/... ./internal/session/...
