[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "re-dragon-harness"
version = "0.3.1"
description = "Agent-first evidence-oriented native reverse engineering harness"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
re-dragon = "re_harness.cli:main"

[tool.setuptools.packages.find]
include = ["re_harness*"]
